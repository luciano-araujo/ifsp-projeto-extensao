# Logs dos conteineres -> CloudWatch Logs (/creator-workbench/containers, retencao 7 dias). Usa as credenciais do no (LabRole).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: creator-workbench
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: creator-workbench-fluent-bit
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, pods/logs]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: creator-workbench-fluent-bit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: creator-workbench-fluent-bit
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: creator-workbench
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: creator-workbench
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        5
        Log_Level    info
        Parsers_File parsers.conf
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*_creator-workbench_*.log
        Parser            cri
        DB                /var/fluent-bit/tail.db
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On
        Refresh_Interval  10
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           Off
        Labels              Off
        Annotations         Off
    [OUTPUT]
        Name                cloudwatch_logs
        Match               kube.*
        region              us-east-1
        log_group_name      /creator-workbench/containers
        log_stream_prefix   pod-
        auto_create_group   false
  parsers.conf: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: creator-workbench
  labels: { app: fluent-bit, Project: creator-workbench }
spec:
  selector:
    matchLabels: { app: fluent-bit }
  template:
    metadata:
      labels: { app: fluent-bit, Project: creator-workbench }
    spec:
      serviceAccountName: fluent-bit
      containers:
        - name: fluent-bit
          image: public.ecr.aws/aws-observability/aws-for-fluent-bit:stable
          resources:
            requests: { cpu: 20m, memory: 50Mi }
            limits: { memory: 150Mi }
          volumeMounts:
            - { name: varlog, mountPath: /var/log, readOnly: true }
            - { name: config, mountPath: /fluent-bit/etc/fluent-bit.conf, subPath: fluent-bit.conf }
            - { name: config, mountPath: /fluent-bit/etc/parsers.conf, subPath: parsers.conf }
            - { name: state, mountPath: /var/fluent-bit }
      volumes:
        - name: varlog
          hostPath: { path: /var/log }
        - name: config
          configMap: { name: fluent-bit-config }
        - name: state
          emptyDir: {}
