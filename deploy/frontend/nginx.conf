# Roda no mesmo pod do backend (conteiner lateral): o backend responde em 127.0.0.1:8080.
# O ELB (HTTP) acrescenta o IP do cliente em X-Forwarded-For; real_ip o recupera e o repassamos como unico salto,
# que e o que o RateLimitFilter do backend le (ele so confia em X-Forwarded-For vindo de 127.0.0.1).
server {
    listen 8081 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 21m;

    set_real_ip_from 172.31.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_request_buffering off;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: /convite -> convite.html, rotas desconhecidas -> index.html
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
