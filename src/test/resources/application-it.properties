# Profile of the integration tests (*IT.java, run with .\mvnw.cmd verify -Pit).
# Uses the LOCAL MySQL, database db_tcc_it (NEVER db_tcc, which holds the demo data).
# The password comes from DB_PASSWORD (same variable as the local profile).
spring.datasource.url=jdbc:mysql://localhost:3306/${IT_DB_NAME:db_tcc_it}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

app.jwt.secret=integration-test-secret-integration-test-secret
app.cors.allowed-origins=http://localhost:3000

# No real e-mail is ever sent by these tests
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=
spring.mail.password=

# Keep the expired-codes job out of the way
app.codes.cleanup-initial-delay-ms=3600000
app.codes.cleanup-interval-ms=3600000

# The SMTP server does not exist in tests: do not let the mail health check turn /actuator/health into 503
management.health.mail.enabled=false

# Low enough for SEC-10 (it uses its own e-mail); fixtures log in a handful of times per e-mail
app.rate-limit.max-attempts=12
# Every IT logs in from 127.0.0.1: the per-IP bucket must not trip (it is covered by unit tests)
app.rate-limit.max-attempts-per-ip=100000

# Uploaded materials of the integration tests (removed by mvn clean)
app.storage.type=local
app.storage.local-dir=target/it-uploads

# The daily deadline digest is triggered by the tests, never by the clock
app.alerts.digest-cron=-

# System administrator of the plan routes (PlanIT creates this user)
app.admin.emails=sysadmin.m5@creatorworkbench.test
